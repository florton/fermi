<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fermi</title>
    <link rel="stylesheet" href="/src/viewer/style.css" />
  </head>
  <body>
    <canvas id="map"></canvas>
    <div class="overlay" id="overlay">Pick a scenario and run a universe.</div>
    <div class="tip" id="tip" hidden></div>

    <header class="topbar" id="top-bar">
      <b class="brand">Fermi</b>
      <select id="scenario" title="Scenario"></select>
      <button id="run" class="primary" title="Simulate, then play / pause (Space)">Run</button>
      <button id="new-seed" hidden title="Simulate a fresh universe with the next seed">New seed</button>
      <button id="open-params" title="All parameters">Parameters</button>
      <span class="sep"></span>
      <div class="menu">
        <button id="layers-btn" title="Choose what the map shows">Layers</button>
        <div class="popover" id="layers" hidden></div>
      </div>
      <label class="slice" title="Which slab of the box to show">Depth <input id="slice-c" type="range" min="0" max="1" step="0.01" value="0.5" /></label>
      <label class="slice" title="How thick a slab; full shows the whole box flattened">Thickness <input id="slice-w" type="range" min="0.05" max="1" step="0.01" value="1" /></label>
      <span class="sep"></span>
      <button id="recenter" title="Fit the box to the screen (0)">Fit</button>
      <button id="toggle-panels" title="Hide or show panels (Tab)">Panels</button>
      <button id="fullscreen" title="Full screen (F)">⛶</button>
    </header>

    <aside class="panel left" id="left">
      <section>
        <h2>Selected</h2>
        <div id="inspector"></div>
      </section>
      <section>
        <h2>Largest lineages now</h2>
        <ol id="lineages" class="lineages"></ol>
      </section>
    </aside>

    <aside class="panel right" id="right">
      <section>
        <h2>Run</h2>
        <div id="stats" class="stats"></div>
      </section>
      <section>
        <h2>Mean traits of living holdings</h2>
        <canvas id="traits" height="120"></canvas>
        <div id="legend" class="legend"></div>
      </section>
      <section class="grow">
        <h2>Chronicle</h2>
        <ol id="chronicle" class="chronicle"></ol>
      </section>
    </aside>

    <footer class="timebar" id="time-bar">
      <select id="speed" title="Playback speed">
        <option value="0.25">0.25 Gyr/s</option>
        <option value="1" selected>1 Gyr/s</option>
        <option value="4">4 Gyr/s</option>
      </select>
      <button id="now" disabled title="Jump to today">Today</button>
      <canvas id="timeline"></canvas>
      <span id="tlabel">0.00 Gyr</span>
    </footer>

    <dialog id="params-dialog">
      <form method="dialog">
        <h2>Parameters</h2>
        <p class="muted">Start from a scenario, then change anything. Run applies them.</p>
        <div id="params" class="params"></div>
        <menu><button value="close">Close</button></menu>
      </form>
    </dialog>

    <script type="module" src="/src/viewer/main.ts"></script>
  </body>
</html>
